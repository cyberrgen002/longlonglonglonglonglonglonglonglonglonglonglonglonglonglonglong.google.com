<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Download File Statis</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;padding:24px;max-width:780px;margin:auto}
    .card{border:1px solid #e6e6e6;padding:18px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,0.03);margin-bottom:14px}
    h1{font-size:22px;margin-bottom:10px}
  </style>
</head>
<body>
  <h1>Download File Statis</h1>

  <div class="card">
    <p>Klik link di bawah untuk mengunduh file statis:</p>
    <a href="sample.txt" download>Download sample.txt</a>
  </div>

  <footer style="margin-top:18px;color:#666;font-size:13px">Pastikan file <code>sample.txt</code> berada di folder yang sama dengan <code>index.html</code>.</footer>
</body>
</html>
